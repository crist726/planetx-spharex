[project]
name = "planetx-spharex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alnnu", email = "alnnuu@proton.me" }
]
requires-python = ">=3.15"
dependencies = [
    "astropy>=8.0.2",
    "astroquery>=0.4.11",
    "firefly-client>=3.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "python-lsp-ruff>=2.3.4",
    "scipy>=1.18.1",
    "streamlit>=1.67.0",
]

[project.scripts]
planetx-spharex = "planetx_spharex:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
